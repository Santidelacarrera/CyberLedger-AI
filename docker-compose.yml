# Dev stack. Replace every credential below before any non-local use.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: dev, POSTGRES_DB: cyberledger }
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
  engine:
    build: ./engine
    environment: { LLM_PROVIDER: "${LLM_PROVIDER:-none}", ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}" }
    ports: ["8000:8000"]
  api:
    build: ./api
    depends_on: [postgres, redis, minio, engine]
    environment:
      DATABASE_URL: postgres://postgres:dev@postgres:5432/cyberledger
      REDIS_HOST: redis
      ENGINE_URL: http://engine:8000
      S3_ENDPOINT: http://minio:9000
      API_KEYS: "${API_KEYS:-dev-secops:sara:secops,dev-finops:fede:finops,dev-admin:root:admin}"
    ports: ["3000:3000"]
  web:
    build: ./web
    ports: ["5173:80"]
