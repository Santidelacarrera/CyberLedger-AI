# Dev stack. Replace every credential below before any non-local use.
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_PASSWORD: dev, POSTGRES_DB: cyberledger }
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
  engine:
    build: ./engine
    environment:
      LLM_PROVIDER: "${LLM_PROVIDER:-none}"   # none (default, $0) | ollama (local, $0)
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # live AWS collection (read-only role recommended); region is required
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
    ports: ["8000:8000"]
  api:
    build: ./api
    depends_on: [postgres, redis, minio, engine]
    environment:
      DATABASE_URL: postgres://postgres:dev@postgres:5432/cyberledger
      REDIS_HOST: redis
      ENGINE_URL: http://engine:8000
      S3_ENDPOINT: http://minio:9000
      WEBHOOK_URL: "${WEBHOOK_URL:-}"          # Slack-compatible incoming webhook
      COLLECT_CRON: "${COLLECT_CRON:-}"        # e.g. "0 */6 * * *" to collect AWS on a schedule
      OIDC_ISSUER: "${OIDC_ISSUER:-}"
      OIDC_JWKS_URI: "${OIDC_JWKS_URI:-}"
      OIDC_AUDIENCE: "${OIDC_AUDIENCE:-}"
      OIDC_ROLE_CLAIM: "${OIDC_ROLE_CLAIM:-roles}"
      API_KEYS: "${API_KEYS:-dev-secops:sara:secops,dev-finops:fede:finops,dev-admin:root:admin}"
    ports: ["3000:3000"]
  web:
    build: ./web
    ports: ["5173:80"]
